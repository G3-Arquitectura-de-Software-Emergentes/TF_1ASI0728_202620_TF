<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="770" viewBox="0 0 1600 770"><rect width="1600" height="770" fill="#F3F3F7"/><text x="35" y="55" font-family="Manrope" font-size="30" font-weight="700" fill="#242238">María Palacios · Fondo familiar con smart contracts</text><text x="35" y="98" font-family="Inter" font-size="18" font-weight="400" fill="#666477">Escenario propuesto para TP1 · Expectativas de diseño, pendientes de validar con usuarios</text><rect x="35" y="135" width="370" height="580" rx="12" fill="white" stroke="#D9D9E2"/><text x="55" y="176" font-family="Manrope" font-size="23" font-weight="700" fill="#534AB7">1. Revisar fondo</text><text x="55" y="252" font-family="Manrope" font-size="17" font-weight="700" fill="#242238">Acción</text><text x="55" y="287" font-family="Inter" font-size="19" font-weight="400" fill="#242238">Consulta saldo, miembros y propuestas</text><text x="55" y="314" font-family="Inter" font-size="19" font-weight="400" fill="#242238">del fondo compartido.</text><text x="55" y="407" font-family="Manrope" font-size="17" font-weight="700" fill="#242238">Pensamiento esperado</text><text x="55" y="442" font-family="Inter" font-size="19" font-weight="400" fill="#242238">Todos conocen las reglas de</text><text x="55" y="469" font-family="Inter" font-size="19" font-weight="400" fill="#242238">aprobación.</text><text x="55" y="572" font-family="Manrope" font-size="17" font-weight="700" fill="#242238">Emoción esperada</text><text x="55" y="607" font-family="Inter" font-size="19" font-weight="400" fill="#242238">Transparencia en el grupo.</text><rect x="425" y="135" width="370" height="580" rx="12" fill="white" stroke="#D9D9E2"/><text x="445" y="176" font-family="Manrope" font-size="23" font-weight="700" fill="#534AB7">2. Proponer gasto</text><text x="445" y="252" font-family="Manrope" font-size="17" font-weight="700" fill="#242238">Acción</text><text x="445" y="287" font-family="Inter" font-size="19" font-weight="400" fill="#242238">Define monto, concepto y destinatario.</text><text x="445" y="314" font-family="Inter" font-size="19" font-weight="400" fill="#242238">La propuesta no cambia el saldo.</text><text x="445" y="407" font-family="Manrope" font-size="17" font-weight="700" fill="#242238">Pensamiento esperado</text><text x="445" y="442" font-family="Inter" font-size="19" font-weight="400" fill="#242238">Primero acordamos el gasto.</text><text x="445" y="572" font-family="Manrope" font-size="17" font-weight="700" fill="#242238">Emoción esperada</text><text x="445" y="607" font-family="Inter" font-size="19" font-weight="400" fill="#242238">Participación en la decisión.</text><rect x="815" y="135" width="370" height="580" rx="12" fill="white" stroke="#D9D9E2"/><text x="835" y="176" font-family="Manrope" font-size="23" font-weight="700" fill="#534AB7">3. Aprobar y firmar</text><text x="835" y="252" font-family="Manrope" font-size="17" font-weight="700" fill="#242238">Acción</text><text x="835" y="287" font-family="Inter" font-size="19" font-weight="400" fill="#242238">Cada miembro revisa y firma la misma</text><text x="835" y="314" font-family="Inter" font-size="19" font-weight="400" fill="#242238">propuesta; todos deben aprobar.</text><text x="835" y="407" font-family="Manrope" font-size="17" font-weight="700" fill="#242238">Pensamiento esperado</text><text x="835" y="442" font-family="Inter" font-size="19" font-weight="400" fill="#242238">Sin un voto, el gasto sigue pendiente.</text><text x="835" y="572" font-family="Manrope" font-size="17" font-weight="700" fill="#242238">Emoción esperada</text><text x="835" y="607" font-family="Inter" font-size="19" font-weight="400" fill="#242238">Control compartido sin privilegios.</text><rect x="1205" y="135" width="370" height="580" rx="12" fill="white" stroke="#D9D9E2"/><text x="1225" y="176" font-family="Manrope" font-size="23" font-weight="700" fill="#534AB7">4. Consultar resultado</text><text x="1225" y="252" font-family="Manrope" font-size="17" font-weight="700" fill="#242238">Acción</text><text x="1225" y="287" font-family="Inter" font-size="19" font-weight="400" fill="#242238">Verifica confirmación del contrato.</text><text x="1225" y="314" font-family="Inter" font-size="19" font-weight="400" fill="#242238">Pendiente, rechazo o error mantienen</text><text x="1225" y="341" font-family="Inter" font-size="19" font-weight="400" fill="#242238">saldo.</text><text x="1225" y="407" font-family="Manrope" font-size="17" font-weight="700" fill="#242238">Pensamiento esperado</text><text x="1225" y="442" font-family="Inter" font-size="19" font-weight="400" fill="#242238">Solo una confirmación válida registra</text><text x="1225" y="469" font-family="Inter" font-size="19" font-weight="400" fill="#242238">el gasto una vez.</text><text x="1225" y="572" font-family="Manrope" font-size="17" font-weight="700" fill="#242238">Emoción esperada</text><text x="1225" y="607" font-family="Inter" font-size="19" font-weight="400" fill="#242238">Trazabilidad del acuerdo familiar.</text></svg>