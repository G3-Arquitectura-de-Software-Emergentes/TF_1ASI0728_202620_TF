<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="770" viewBox="0 0 1600 770"><rect width="1600" height="770" fill="#F3F3F7"/><text x="35" y="55" font-family="Manrope" font-size="30" font-weight="700" fill="#242238">Carlos Castillo · Organización financiera con IA</text><text x="35" y="98" font-family="Inter" font-size="18" font-weight="400" fill="#666477">Escenario propuesto para TP1 · Expectativas de diseño, pendientes de validar con usuarios</text><rect x="35" y="135" width="370" height="580" rx="12" fill="white" stroke="#D9D9E2"/><text x="55" y="176" font-family="Manrope" font-size="23" font-weight="700" fill="#534AB7">1. Registrar gasto</text><text x="55" y="252" font-family="Manrope" font-size="17" font-weight="700" fill="#242238">Acción</text><text x="55" y="287" font-family="Inter" font-size="19" font-weight="400" fill="#242238">Ingresa monto y descripción. Solicita</text><text x="55" y="314" font-family="Inter" font-size="19" font-weight="400" fill="#242238">una categoría con IA.</text><text x="55" y="407" font-family="Manrope" font-size="17" font-weight="700" fill="#242238">Pensamiento esperado</text><text x="55" y="442" font-family="Inter" font-size="19" font-weight="400" fill="#242238">Quiero reducir el tiempo de</text><text x="55" y="469" font-family="Inter" font-size="19" font-weight="400" fill="#242238">clasificación.</text><text x="55" y="572" font-family="Manrope" font-size="17" font-weight="700" fill="#242238">Emoción esperada</text><text x="55" y="607" font-family="Inter" font-size="19" font-weight="400" fill="#242238">Interés por una ayuda sencilla.</text><rect x="425" y="135" width="370" height="580" rx="12" fill="white" stroke="#D9D9E2"/><text x="445" y="176" font-family="Manrope" font-size="23" font-weight="700" fill="#534AB7">2. Revisar y guardar</text><text x="445" y="252" font-family="Manrope" font-size="17" font-weight="700" fill="#242238">Acción</text><text x="445" y="287" font-family="Inter" font-size="19" font-weight="400" fill="#242238">Acepta o corrige la categoría. Guarda</text><text x="445" y="314" font-family="Inter" font-size="19" font-weight="400" fill="#242238">tras revisar el gasto.</text><text x="445" y="407" font-family="Manrope" font-size="17" font-weight="700" fill="#242238">Pensamiento esperado</text><text x="445" y="442" font-family="Inter" font-size="19" font-weight="400" fill="#242238">La decisión final sigue siendo mía.</text><text x="445" y="572" font-family="Manrope" font-size="17" font-weight="700" fill="#242238">Emoción esperada</text><text x="445" y="607" font-family="Inter" font-size="19" font-weight="400" fill="#242238">Control sobre sus movimientos.</text><rect x="815" y="135" width="370" height="580" rx="12" fill="white" stroke="#D9D9E2"/><text x="835" y="176" font-family="Manrope" font-size="23" font-weight="700" fill="#534AB7">3. Consultar asistente</text><text x="835" y="252" font-family="Manrope" font-size="17" font-weight="700" fill="#242238">Acción</text><text x="835" y="287" font-family="Inter" font-size="19" font-weight="400" fill="#242238">Elige un período y revisa gastos</text><text x="835" y="314" font-family="Inter" font-size="19" font-weight="400" fill="#242238">hormiga en sus movimientos</text><text x="835" y="341" font-family="Inter" font-size="19" font-weight="400" fill="#242238">autorizados.</text><text x="835" y="407" font-family="Manrope" font-size="17" font-weight="700" fill="#242238">Pensamiento esperado</text><text x="835" y="442" font-family="Inter" font-size="19" font-weight="400" fill="#242238">Puedo comprobar qué compras se</text><text x="835" y="469" font-family="Inter" font-size="19" font-weight="400" fill="#242238">repiten.</text><text x="835" y="572" font-family="Manrope" font-size="17" font-weight="700" fill="#242238">Emoción esperada</text><text x="835" y="607" font-family="Inter" font-size="19" font-weight="400" fill="#242238">Claridad sobre sus hábitos.</text><rect x="1205" y="135" width="370" height="580" rx="12" fill="white" stroke="#D9D9E2"/><text x="1225" y="176" font-family="Manrope" font-size="23" font-weight="700" fill="#534AB7">4. Evaluar su meta</text><text x="1225" y="252" font-family="Manrope" font-size="17" font-weight="700" fill="#242238">Acción</text><text x="1225" y="287" font-family="Inter" font-size="19" font-weight="400" fill="#242238">Revisa una sugerencia de ahorro.</text><text x="1225" y="314" font-family="Inter" font-size="19" font-weight="400" fill="#242238">Decide si ajusta su plan.</text><text x="1225" y="407" font-family="Manrope" font-size="17" font-weight="700" fill="#242238">Pensamiento esperado</text><text x="1225" y="442" font-family="Inter" font-size="19" font-weight="400" fill="#242238">Usaré la orientación si encaja con mi</text><text x="1225" y="469" font-family="Inter" font-size="19" font-weight="400" fill="#242238">situación.</text><text x="1225" y="572" font-family="Manrope" font-size="17" font-weight="700" fill="#242238">Emoción esperada</text><text x="1225" y="607" font-family="Inter" font-size="19" font-weight="400" fill="#242238">Confianza con revisión personal.</text></svg>