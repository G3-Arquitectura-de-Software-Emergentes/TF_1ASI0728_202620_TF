<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="830" viewBox="0 0 1600 830"><rect width="1600" height="830" fill="#F3F3F7"/><text x="35" y="55" font-family="Manrope" font-size="30" font-weight="700" fill="#242238">TP1 · Integración de IA y smart contracts</text><rect x="35" y="145" width="430" height="170" rx="12" fill="white" stroke="#D9D9E2"/><text x="53" y="182" font-family="Manrope" font-size="22" font-weight="700" fill="#534AB7">Aplicación web / móvil</text><text x="53" y="221" font-family="Inter" font-size="19" font-weight="400" fill="#242238">Usuario autenticado</text><text x="53" y="248" font-family="Inter" font-size="19" font-weight="400" fill="#242238">Revisa categorías y recomendaciones</text><text x="53" y="275" font-family="Inter" font-size="19" font-weight="400" fill="#242238">Miembro firma su aprobación</text><rect x="570" y="145" width="440" height="225" rx="12" fill="white" stroke="#D9D9E2"/><text x="588" y="182" font-family="Manrope" font-size="22" font-weight="700" fill="#534AB7">Backend modular · Spring Boot</text><text x="588" y="221" font-family="Inter" font-size="19" font-weight="400" fill="#242238">Categories: categorización IA</text><text x="588" y="248" font-family="Inter" font-size="19" font-weight="400" fill="#242238">Analytics / Savings: asistente</text><text x="588" y="275" font-family="Inter" font-size="19" font-weight="400" fill="#242238">Household / Finances: propuestas</text><text x="588" y="302" font-family="Inter" font-size="19" font-weight="400" fill="#242238">IAM: permisos por miembro</text><rect x="1120" y="145" width="440" height="180" rx="12" fill="white" stroke="#D9D9E2"/><text x="1138" y="182" font-family="Manrope" font-size="22" font-weight="700" fill="#534AB7">Proveedor de IA</text><text x="1138" y="221" font-family="Inter" font-size="19" font-weight="400" fill="#242238">Datos mínimos autorizados</text><text x="1138" y="248" font-family="Inter" font-size="19" font-weight="400" fill="#242238">Respuesta validada por el backend</text><text x="1138" y="275" font-family="Inter" font-size="19" font-weight="400" fill="#242238">Alternativa manual ante fallos</text><rect x="1120" y="440" width="440" height="205" rx="12" fill="white" stroke="#D9D9E2"/><text x="1138" y="477" font-family="Manrope" font-size="22" font-weight="700" fill="#534AB7">Red blockchain / smart contract</text><text x="1138" y="516" font-family="Inter" font-size="19" font-weight="400" fill="#242238">Misma propuesta y miembros definidos</text><text x="1138" y="543" font-family="Inter" font-size="19" font-weight="400" fill="#242238">N de N firmas requeridas</text><text x="1138" y="570" font-family="Inter" font-size="19" font-weight="400" fill="#242238">Resultado pendiente o confirmado</text><text x="1138" y="597" font-family="Inter" font-size="19" font-weight="400" fill="#242238">Sin claves privadas en el backend</text><rect x="570" y="520" width="440" height="195" rx="12" fill="white" stroke="#D9D9E2"/><text x="588" y="557" font-family="Manrope" font-size="22" font-weight="700" fill="#534AB7">PostgreSQL · Datos off-chain</text><text x="588" y="596" font-family="Inter" font-size="19" font-weight="400" fill="#242238">Datos personales fuera de blockchain</text><text x="588" y="623" font-family="Inter" font-size="19" font-weight="400" fill="#242238">Propuestas y estado de conciliación</text><text x="588" y="650" font-family="Inter" font-size="19" font-weight="400" fill="#242238">Gasto registrado una sola vez</text><text x="500" y="223" font-family="Manrope" font-size="23" font-weight="700" fill="#534AB7">→</text><text x="1020" y="253" font-family="Manrope" font-size="23" font-weight="700" fill="#534AB7">→</text><text x="1020" y="378" font-family="Manrope" font-size="23" font-weight="700" fill="#534AB7">↘</text><text x="770" y="433" font-family="Manrope" font-size="23" font-weight="700" fill="#534AB7">↓</text><text x="35" y="441" font-family="Manrope" font-size="21" font-weight="700" fill="#242238">Firma controlada por el miembro</text><text x="35" y="487" font-family="Inter" font-size="20" font-weight="400" fill="#242238">La app envía la aprobación firmada para verificarla</text><text x="35" y="516" font-family="Inter" font-size="20" font-weight="400" fill="#242238">con el contrato. El backend consulta el estado y</text><text x="35" y="545" font-family="Inter" font-size="20" font-weight="400" fill="#242238">concilia tras confirmación.</text><text x="35" y="772" font-family="Inter" font-size="18" font-weight="400" fill="#666477">Diseño TP1: proveedor de IA, red, costos y política de confirmación pendientes de selección y pruebas.</text></svg>