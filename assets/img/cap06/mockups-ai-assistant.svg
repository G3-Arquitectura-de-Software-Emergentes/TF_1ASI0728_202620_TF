ize="18" font-weight="400" fill="#242238">Meta: S/ 500.00</text><text x="918" y="337" font-family="Inter" font-size="18" font-weight="400" fill="#242238">Ahorrado: S/ 300.00 · Faltan S/ 200.00</text><text x="918" y="387" font-family="Inter" font-size="18" font-weight="400" fill="#242238">Sugerencia: revisar gastos recurrentes</text><text x="918" y="437" font-family="Inter" font-size="18" font-weight="400" fill="#242238">El asistente no cambia tu presupuesto</text><rect x="912" y="610" width="342" height="46" rx="10" fill="#CDEB45" stroke="#D9D9E2"/><text x="926" y="637" font-family="Manrope" font-size="17" font-weight="700" fill="#242238">Revisar sugerencia</text><rect x="912" y="669" width="342" height="46" rx="10" fill="#F3F3F7" stroke="#D9D9E2"/><text x="926" y="696" font-family="Inter" font-size="17" font-weight="400" fill="#242238">Volver al asistente</text><text x="912" y="753" font-family="Inter" font-size="15" font-weight="400" fill="#666477">Inicio    Movimientos    Familia</text><text x="888" y="831" font-family="Inter" font-size="14" font-weight="400" fill="#666477">US 034 · La recomendación no ejecuta cambios.</text><text x="1314" y="131" font-family="Manrope" font-size="16" font-weight="700" fill="#534AB7">WF08</text><rect x="1314" y="148" width="390" height="650" rx="25" fill="white" stroke="#D9D9E2"/><rect x="1330" y="170" width="358" height="76" rx="10" fill="#534AB7" stroke="#D9D9E2"/><text x="1344" y="211" font-family="Manrope" font-size="23" font-weight="700" fill="white">Ayuda no disponible</text><text x="1344" y="287" font-family="Inter" font-size="18" font-weight="400" fill="#242238">La IA no pudo generar una respuesta</text><text x="1344" y="337" font-family="Inter" font-size="18" font-weight="400" fill="#242238">Puedes elegir la categoría manualmente</text><text x="1344" y="387" font-family="Inter" font-size="18" font-weight="400" fill="#242238">Tus datos del formulario se conservan</text><text x="1344" y="437" font-family="Inter" font-size="18" font-weight="400" fill="#242238">No se ha registrado ningún gasto</text><rect x="1338" y="610" width="342" height="46" rx="10" fill="#CDEB45" stroke="#D9D9E2"/><text x="1352" y="637" font-family="Manrope" font-size="17" font-weight="700" fill="#242238">Elegir categoría</text><rect x="1338" y="669" width="342" height="46" rx="10" fill="#F3F3F7" stroke="#D9D9E2"/><text x="1352" y="696" font-family="Inter" font-size="17" font-weight="400" fill="#242238">Reintentar análisis</text><text x="1338" y="753" font-family="Inter" font-size="15" font-weight="400" fill="#666477">Inicio    Movimientos    Familia</text><text x="1314" y="831" font-family="Inter" font-size="14" font-weight="400" fill="#666477">TS 024 · Error o datos insuficientes sin éxito anticipado.</text></svg>