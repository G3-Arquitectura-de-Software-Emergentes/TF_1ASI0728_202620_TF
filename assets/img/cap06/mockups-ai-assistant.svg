<svg xmlns="http://www.w3.org/2000/svg" width="1740" height="890" viewBox="0 0 1740 890"><rect width="1740" height="890" fill="#F3F3F7"/><text x="36" y="54" font-family="Manrope" font-size="30" font-weight="700" fill="#242238">6.4.3 · Asistente financiero y alternativas</text><text x="36" y="88" font-family="Inter" font-size="18" font-weight="400" fill="#666477">Intiva · Balanza · TP1 · IA y smart contracts</text><text x="36" y="131" font-family="Manrope" font-size="16" font-weight="700" fill="#534AB7">WF05</text><rect x="36" y="148" width="390" height="650" rx="25" fill="white" stroke="#D9D9E2"/><rect x="52" y="170" width="358" height="76" rx="10" fill="#534AB7" stroke="#D9D9E2"/><text x="66" y="211" font-family="Manrope" font-size="23" font-weight="700" fill="white">Asistente financiero</text><text x="66" y="287" font-family="Inter" font-size="18" font-weight="400" fill="#242238">Período: septiembre 2026</text><text x="66" y="337" font-family="Inter" font-size="18" font-weight="400" fill="#242238">Datos: movimientos personales</text><text x="66" y="387" font-family="Inter" font-size="18" font-weight="400" fill="#242238">¿Dónde puedo reducir gastos pequeños?</text><text x="66" y="437" font-family="Inter" font-size="18" font-weight="400" fill="#242238">Análisis orientativo con IA</text><rect x="60" y="610" width="342" height="46" rx="10" fill="#CDEB45" stroke="#D9D9E2"/><text x="74" y="637" font-family="Manrope" font-size="17" font-weight="700" fill="#242238">Analizar mis gastos</text><rect x="60" y="669" width="342" height="46" rx="10" fill="#F3F3F7" stroke="#D9D9E2"/><text x="74" y="696" font-family="Inter" font-size="17" font-weight="400" fill="#242238">Consultar mi meta</text><text x="60" y="753" font-family="Inter" font-size="15" font-weight="400" fill="#666477">Inicio    Movimientos    Familia</text><text x="36" y="831" font-family="Inter" font-size="14" font-weight="400" fill="#666477">US 034 · Solo datos autorizados del período elegido.</text><text x="462" y