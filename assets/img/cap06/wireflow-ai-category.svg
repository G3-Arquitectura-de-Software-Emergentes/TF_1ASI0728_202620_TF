<svg xmlns="http://www.w3.org/2000/svg" width="1740" height="780" viewBox="0 0 1740 780"><rect width="1740" height="780" fill="#F3F3F7"/><text x="36" y="54" font-family="Manrope" font-size="30" font-weight="700" fill="#242238">F01 · Categorizar y confirmar un gasto</text><text x="36" y="90" font-family="Inter" font-size="18" font-weight="400" fill="#666477">Ruta principal y condiciones de salida · Datos de ejemplo</text><rect x="36" y="125" width="360" height="352" rx="18" fill="white" stroke="#D9D9E2"/><text x="56" y="166" font-family="Manrope" font-size="21" font-weight="700" fill="#242238">WF01 · Registrar gasto</text><text x="56" y="244" font-family="Inter" font-size="17" font-weight="400" fill="#242238">Monto: S/ 48.90</text><text x="56" y="268" font-family="Inter" font-size="17" font-weight="400" fill="#242238">Descripción: compra de alimentos</text><text x="56" y="292" font-family="Inter" font-size="17" font-weight="400" fill="#242238">Cuenta: Personal</text><rect x="56" y="397" width="320" height="52" rx="10" fill="#CDEB45" stroke="#D9D9E2"/><text x="69" y="425" font-family="Manrope" font-size="16" font-weight="700" fill="#242238">Sugerir categoría con IA</text><text x="409" y="308" font-family="Manrope" font-size="28" font-weight="700" fill="#534AB7">→</text><rect x="462" y="125" width="360" height="352" rx="18" fill="white" stroke="#D9D9E2"/><text x="482" y="166" font-family="Manrope" font-size="21" font-weight="700" fill="#242238">WF02 · Categoría sugerida</text><text x="482" y="244" font-family="Inter" font-size="17" font-weight="400" fill="#242238">Alimentación</text><text x="482" y="268" font-family="Inter" font-size="17" font-weight="400" fill="#242238">Sugerencia basada en la descripción</text><text x="482" y="292" font-family="Inter" font-size="17" font-weight="400" fill="#242238">Puedes aceptar o cambiar la categoría</text><rect x="482" y="397" width="320" height="52" rx="10" fill="#CDEB45" stroke="#D9D9E2"/><text x="495" y="425" font-family="Manrope" font-size="16" font-weight="700" fill="#242238">Cambiar categoría</text><text x="835" y="308" font-family="Manrope" font-size="28" font-weight="700" fill="#534AB7">→</text><rect x="888" y="125" width="360" height="352" rx="18" fill="white" stroke="#D9D9E2"/><text x="908" y="166" font-family="Manrope" font-size="21" font-weight="700" fill="#242238">WF03 · Elegir categoría</text><text x="908" y="244" font-family="Inter" font-size="17" font-weight="400" fill="#242238">Alimentación</text><text x="908" y="268" font-family="Inter" font-size="17" font-weight="400" fill="#242238">Transporte</text><text x="908" y="292" font-family="Inter" font-size="17" font-weight="400" fill="#242238">Salud</text><rect x="908" y="397" width="320" height="52" rx="10" fill="#CDEB45" stroke="#D9D9E2"/><text x="921" y="425" font-family="Manrope" font-size="16" font-weight="700" fill="#242238">Aplicar selección</text><text x="1261" y="308" font-family="Manrope" font-size="28" font-weight="700" fill="#534AB7">→</text><rect x="1314" y="125" width="360" height="352" rx="18" fill="white" stroke="#D9D9E2"/><text x="1334" y="166" font-family="Manrope" font-size="21" font-weight="700" fill="#242238">WF04 · Revisar y guardar</text><text x="1334" y="244" font-family="Inter" font-size="17" font-weight="400" fill="#242238">Monto: S/ 48.90</text><text x="1334" y="268" font-family="Inter" font-size="17" font-weight="400" fill="#242238">Categoría elegida: Alimentación</text><text x="1334" y="292" font-family="Inter" font-size="17" font-weight="400" fill="#242238">Cuenta: Personal</text><rect x="1334" y="397" width="320" height="52" rx="10" fill="#CDEB45" stroke="#D9D9E2"/><text x="1347" y="425" font-family="Manrope" font-size="16" font-weight="700" fill="#242238">Guardar gasto</text><path d="M642 477 V505 H1494 V477" fill="none" stroke="#534AB7" stroke-width="2"/><text x="760" y="500" font-family="Inter" font-size="15" font-weight="400" fill="#534AB7">Aceptar categoría → saltar WF03 y revisar en WF04</text><text x="36" y="568" font-family="Manrope" font-size="20" font-weight="700" fill="#242238">Rutas alternativas</text><text x="36" y="605" font-family="Inter" font-size="18" font-weight="400" fill="#242238">Aceptar: WF02 → WF04. Corregir: WF02 → WF03 → WF04. IA no disponible: WF08 → elección manual. Guardado fallido: mantener datos y saldo previo.</text></svg>