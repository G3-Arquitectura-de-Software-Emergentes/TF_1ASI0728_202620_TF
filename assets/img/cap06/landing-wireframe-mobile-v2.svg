<svg xmlns="http://www.w3.org/2000/svg" width="390" height="1710" viewBox="0 0 390 1710"><rect width="390" height="1710" fill="#F3F3F7"/><rect x="0" y="0" width="390" height="1710" rx="0" fill="#FFFFFF" stroke="#D9D9E2"/><text x="24" y="50" font-family="Manrope" font-size="26" font-weight="700" fill="#534AB7">intiva</text><text x="24" y="140" font-family="Manrope" font-size="35" font-weight="700" fill="#534AB7">Tus finanzas,</text><text x="24" y="190" font-family="Manrope" font-size="35" font-weight="700" fill="#534AB7">con IA y acuerdos</text><text x="24" y="240" font-family="Manrope" font-size="35" font-weight="700" fill="#534AB7">en familia</text><text x="24" y="313" font-family="Inter" font-size="18" font-weight="400" fill="#242238">Clasifica tus gastos con IA, identifica</text><text x="24" y="339" font-family="Inter" font-size="18" font-weight="400" fill="#242238">gastos hormiga y organiza el fondo</text><text x="24" y="365" font-family="Inter" font-size="18" font-weight="400" fill="#242238">familiar con aprobación de todos sus</text><text x="24" y="391" font-family="Inter" font-size="18" font-weight="400" fill="#242238">miembros.</text><rect x="24" y="424" width="342" height="54" rx="12" fill="#EEEEF2" stroke="#D9D9E2"/><text x="44" y="456" font-family="Manrope" font-size="18" font-weight="700" fill="#242238">Conoce cómo funciona</text><rect x="24" y="526" width="342" height="154" rx="12" fill="#F3F3F7" stroke="#D9D9E2"/><text x="42" y="564" font-family="Manrope" font-size="20" font-weight="700" fill="#534AB7">IA para organizar tus gastos</text><text x="42" y="605" font-family="Inter" font-size="16" font-weight="400" fill="#242238">Ingresa monto y descripción. Acepta o</text><text x="42" y="628" font-family="Inter" font-size="16" font-weight="400" fill="#242238">corrige la categoría antes de guardar.</text><rect x="24" y="698" width="342" height="154" rx="12" fill="#F3F3F7" stroke="#D9D9E2"/><text x="42" y="736" font-family="Manrope" font-size="20" font-weight="700" fill="#534AB7">Asistente para tu ahorro</text><text x="42" y="777" font-family="Inter" font-size="16" font-weight="400" fill="#242238">Revisa gastos pequeños recurrentes y</text><text x="42" y="800" font-family="Inter" font-size="16" font-weight="400" fill="#242238">sugerencias para tus metas. Tú decides qué</text><text x="42" y="823" font-family="Inter" font-size="16" font-weight="400" fill="#242238">ajustar.</text><rect x="24" y="870" width="342" height="154" rx="12" fill="#F3F3F7" stroke="#D9D9E2"/><text x="42" y="908" font-family="Manrope" font-size="20" font-weight="700" fill="#534AB7">Smart contracts en familia</text><text x="42" y="949" font-family="Inter" font-size="16" font-weight="400" fill="#242238">Propón un gasto del fondo. Todos los</text><text x="42" y="972" font-family="Inter" font-size="16" font-weight="400" fill="#242238">miembros deben aprobarlo antes de su</text><text x="42" y="995" font-family="Inter" font-size="16" font-weight="400" fill="#242238">validación.</text><rect x="24" y="1042" width="342" height="154" rx="12" fill="#F3F3F7" stroke="#D9D9E2"/><text x="42" y="1080" font-family="Manrope" font-size="20" font-weight="700" fill="#534AB7">Control en cada paso</text><text x="42" y="1121" font-family="Inter" font-size="16" font-weight="400" fill="#242238">Las propuestas pendientes, rechazadas o</text><text x="42" y="1144" font-family="Inter" font-size="16" font-weight="400" fill="#242238">con error no modifican el saldo del fondo.</text><text x="24" y="1247" font-family="Manrope" font-size="18" font-weight="700" fill="#242238">Equipo Balanza · Planes por confirmar</text><text x="24" y="1294" font-family="Inter" font-size="15" font-weight="400" fill="#666477">Diseño académico TP1. Publicación y contrato</text><text x="24" y="1315" font-family="Inter" font-size="15" font-weight="400" fill="#666477">desplegado pendientes de validación.</text></svg>