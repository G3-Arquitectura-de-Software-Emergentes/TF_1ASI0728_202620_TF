<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1600" viewBox="0 0 1440 1600"><rect width="1440" height="1600" fill="#F3F3F7"/><rect x="0" y="0" width="1440" height="1600" rx="0" fill="#FFFFFF" stroke="#D9D9E2"/><text x="84" y="50" font-family="Manrope" font-size="26" font-weight="700" fill="#534AB7">intiva</text><text x="790" y="51" font-family="Inter" font-size="18" font-weight="400" fill="#242238">Beneficios    Cómo funciona    Equipo    Planes</text><text x="84" y="167" font-family="Manrope" font-size="62" font-weight="700" fill="#534AB7">Tus finanzas,</text><text x="84" y="256" font-family="Manrope" font-size="62" font-weight="700" fill="#534AB7">con IA y acuerdos</text><text x="84" y="345" font-family="Manrope" font-size="62" font-weight="700" fill="#534AB7">en familia</text><text x="84" y="419" font-family="Inter" font-size="24" font-weight="400" fill="#242238">Clasifica tus gastos con IA, identifica gastos hormiga y organiza el fondo familiar con aprobación de todos sus</text><text x="84" y="453" font-family="Inter" font-size="24" font-weight="400" fill="#242238">miembros.</text><rect x="84" y="488" width="350" height="54" rx="12" fill="#CDEB45" stroke="#D9D9E2"/><text x="104" y="520" font-family="Manrope" font-size="18" font-weight="700" fill="#242238">Conoce cómo funciona</text><rect x="84" y="590" width="1272" height="145" rx="12" fill="#F3F3F7" stroke="#D9D9E2"/><text x="102" y="634" font-family="Manrope" font-size="26" font-weight="700" fill="#534AB7">IA para organizar tus gastos</text><text x="102" y="674" font-family="Inter" font-size="21" font-weight="400" fill="#242238">Ingresa monto y descripción. Acepta o corrige la categoría antes de guardar.</text><rect x="84" y="753" width="1272" height="145" rx="12" fill="#F3F3F7" stroke="#D9D9E2"/><text x="102" y="797" font-family="Manrope" font-size="26" font-weight="700" fill="#534AB7">Asistente para tu ahorro</text><text x="102" y="837" font-family="Inter" font-size="21" font-weight="400" fill="#242238">Revisa gastos pequeños recurrentes y sugerencias para tus metas. Tú decides qué ajustar.</text><rect x="84" y="916" width="1272" height="145" rx="12" fill="#F3F3F7" stroke="#D9D9E2"/><text x="102" y="960" font-family="Manrope" font-size="26" font-weight="700" fill="#534AB7">Smart contracts en familia</text><text x="102" y="1000" font-family="Inter" font-size="21" font-weight="400" fill="#242238">Propón un gasto del fondo. Todos los miembros deben aprobarlo antes de su validación.</text><rect x="84" y="1079" width="1272" height="145" rx="12" fill="#F3F3F7" stroke="#D9D9E2"/><text x="102" y="1123" font-family="Manrope" font-size="26" font-weight="700" fill="#534AB7">Control en cada paso</text><text x="102" y="1163" font-family="Inter" font-size="21" font-weight="400" fill="#242238">Las propuestas pendientes, rechazadas o con error no modifican el saldo del fondo.</text><text x="84" y="1275" font-family="Manrope" font-size="18" font-weight="700" fill="#242238">Equipo Balanza · Planes por confirmar</text><text x="84" y="1322" font-family="Inter" font-size="15" font-weight="400" fill="#666477">Diseño académico TP1. Publicación y contrato desplegado pendientes de validación.</text></svg>